<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--accent:#4F46E5;--text:#1E1E24;--muted:#6B6B76;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:linear-gradient(155deg,#6D5AE0 0%,#4F46E5 42%,#2E2A8F 100%);font-family:'Plus Jakarta Sans',sans-serif;color:var(--text);display:flex;align-items:center;justify-content:center;padding:32px 16px;}
  .card{width:100%;max-width:400px;background:#FBFAFF;border-radius:22px;padding:40px 36px;text-align:center;box-shadow:0 30px 60px -20px rgba(24,16,80,0.45);}
  .check{width:52px;height:52px;border-radius:50%;background:#EEF0FF;color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:24px;font-weight:700;}
  h1{font-size:21px;font-weight:700;margin:0 0 8px;}
  p{font-size:14px;color:var(--muted);margin:0;line-height:1.5;}
</style>
</head>
<body>
  <div class="card">
    <div class="check">&#10003;</div>
    <h1>Pendaftaran berhasil</h1>
    <p>Akun kamu sudah dibuat. Selamat datang!</p>
  </div>
</body>
</html>
